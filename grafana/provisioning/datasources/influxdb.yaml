apiVersion: 1

datasources:
  - name: IIoT InfluxDB
    uid: iiot-influxdb
    type: influxdb
    access: proxy
    url: ${INFLUXDB_URL}
    isDefault: true
    editable: true
    jsonData:
      version: SQL
      dbName: ${INFLUXDB_BUCKET}
      httpMode: POST
      insecureGrpc: false
    secureJsonData:
      token: ${INFLUXDB_GRAFANA_READ_TOKEN}
